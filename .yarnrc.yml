approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

logFilters:
  - level: discard
    pattern: backbone*1.6.0*
  - level: discard
    pattern: underscore*1.13.6*

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - vitest
  - "@vitest/*"

npmPublishRegistry: "https://registry.npmjs.org"

packageExtensions:
  "@nivo/funnel@*":
    dependencies:
      lodash: "*"
  "@nivo/line@*":
    dependencies:
      lodash: "*"
  "@prefresh/core@*":
    dependencies:
      preact: "*"
  "@testing-library/jest-dom@*":
    peerDependencies:
      vitest: "*"
  vite-plus@*:
    peerDependencies:
      vite: "*"
      vitest: "*"
    peerDependenciesMeta:
      vite:
        optional: true
      vitest:
        optional: true

plugins:
  - ./plugin-ci-version.cjs

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.18.1.cjs
