# Trivy identifies the Vite+ core alias as vite-plus and uses it's version

vulnerabilities:
  - id: CVE-2022-35204
    paths: [yarn.lock]
    statement: &vite-statement
      vite aliases @voidzero-dev/vite-plus-core, which bundles Vite 8+ versions not affected by these CVEs

  - id: CVE-2023-34092
    paths: [yarn.lock]
    statement: *vite-statement

  - id: CVE-2024-52011
    paths: [yarn.lock]
    statement: *vite-statement

  - id: CVE-2026-53571
    paths: [yarn.lock]
    statement: *vite-statement

  - id: CVE-2026-112942
    paths: [yarn.lock]
    statement: *vite-statement
