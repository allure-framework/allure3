name: Build project

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build project
        uses: ./.github/actions/build
        with:
          save-cache: "true"
      - name: Check formatting, typed lint and production types
        run: yarn verify

  test:
    needs: lint
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Build project
        uses: ./.github/actions/build
        id: build
        with:
          yarn-hardened-mode: "0"
          save-cache: "${{ matrix.os != 'ubuntu-latest' }}"
      - parallel:
          - name: Install Playwright browsers
            timeout-minutes: 5
            run: yarn workspace @allurereport/common-config playwright install chromium firefox webkit
          - name: Install playwright dependencies for e2e
            timeout-minutes: 5
            run: yarn workspace @allurereport/common-config playwright install-deps
      - name: Record test start for the recovery summary
        id: recovery-start
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "time=" + Date.now() + "\n")'
      - name: Test Project
        env:
          ENABLE_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
        run: yarn allure run --config=./allurerc.mjs --environment=${{ matrix.os }} --dump=allure-results-${{ matrix.os }} -- yarn test
      - name: Record test end for the recovery summary
        id: recovery-end
        if: ${{ !cancelled() && steps.recovery-start.outputs.time != '' }}
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "time=" + Date.now() + "\n")'
      - name: Upload test results
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.os }}
          path: ./allure-results-${{ matrix.os }}.zip
      - name: Collect test executions for the recovery summary
        id: collect-recoveries
        if: ${{ !cancelled() && steps.recovery-end.outputs.time != '' }}
        continue-on-error: true
        env:
          CI_CHECK_RUN_ID: ${{ job.check_run_id }}
          TEST_ENVIRONMENT: ${{ matrix.os }}
          TEST_STARTED_AT: ${{ steps.recovery-start.outputs.time }}
          TEST_FINISHED_AT: ${{ steps.recovery-end.outputs.time }}
        shell: bash
        run: node scripts/ci-flake-recoveries.mjs collect "allure-results-$TEST_ENVIRONMENT.zip" ci-recovery.json "$TEST_ENVIRONMENT" "$TEST_STARTED_AT" "$TEST_FINISHED_AT"
      - name: Upload test executions for this workflow attempt
        if: ${{ !cancelled() && steps.collect-recoveries.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-recovery-${{ github.run_attempt }}-${{ matrix.os }}
          path: ./ci-recovery.json
      - name: Upload blob reports
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        with:
          name: vitest-blobs-${{ matrix.os }}
          path: packages/*/.vitest/blob/*.json
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [test]
    name: Upload test coverage
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.test.result) }}
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set up node and install dependencies
        uses: ./.github/actions/install
        with:
          yarn-hardened-mode: "0"
      - name: Download vitest blob reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: vitest-blobs-*
          path: ./
      - name: Generate test coverage report
        env:
          VITEST_BLOB_PATTERN: "**/.vitest/blob/*.json"
        run: yarn coverage
      - name: Publish code coverage
        uses: clearlyip/code-coverage-report-action@v7
        with:
          filename: packages/common-config/.vitest/coverage/cobertura-coverage.xml
          badge: true
          togglable-report: true
          report-low-coverage-only: true

  report:
    needs: [lint, test]
    name: Build report
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.test.result) && needs.lint.result != 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: write
    env:
      ALLURE_QUALITY_GATE: "1"
      ALLURE_REQUIRE_NEW_TESTS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'pr:new feature') && '1' || '' }}
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_LAUNCH_TAGS: "${{ secrets.ALLURE_LAUNCH_TAGS }}, ${{ github.event_name }}"
      ALLURE_PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Download allure results
        timeout-minutes: 10
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: ./
      - name: Build project
        uses: ./.github/actions/build
        with:
          yarn-hardened-mode: "0"
      - name: Measure report generation
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-perf-probe-results
        run: yarn workspace @allurereport/core test --config=vitest.perf.config.ts
      - name: Prepare report metrics
        run: |
          mkdir -p ./allure-perf-results
          cp ./allure-perf-probe-results/*-perf.json ./allure-perf-results/
      - name: Generate report
        run: yarn allure generate --config=./allurerc.mjs --dump="allure-results-*/*.zip" ./allure-perf-results --output=./allure-report
      - name: Download test executions across workflow attempts
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-recovery-*
          path: ./allure-recovery-data
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Summarize flaky test recoveries
        if: ${{ !cancelled() }}
        continue-on-error: true
        id: recovery-summary
        run: |
          summary_path="$RUNNER_TEMP/allure-flake-recoveries.md"
          GITHUB_STEP_SUMMARY="$summary_path" node scripts/ci-flake-recoveries.mjs summary ./allure-recovery-data ./allure-report/awesome/summary.json
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment flaky test recoveries on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.recovery-summary.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = require("node:fs/promises");
            const { join } = require("node:path");
            const summary = await readFile(join(process.env.RUNNER_TEMP, "allure-flake-recoveries.md"), "utf8");
            const marker = "<!-- allure-flake-recoveries -->";
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const footer = `[Build project summary](${run})`;
            let body = `${marker}\n${summary}\n${footer}`;
            if (Buffer.byteLength(body, "utf8") > 65_536) {
              const counts = summary.split("\n").slice(0, 4).join("\n");
              body = `${marker}\n${counts}\n\n${footer}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.head.sha !== context.payload.pull_request.head.sha) {
              return;
            }
            for await (const { data: comments } of github.paginate.iterator(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })) {
              const existing = comments.find(({ user, body }) =>
                user?.login === "github-actions[bot]" && body?.startsWith(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Allure Report Official
        if: ${{ !cancelled() }}
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
