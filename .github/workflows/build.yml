name: Build project

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build project
        uses: ./.github/actions/build
        with:
          save-cache: "true"
      - name: Check formatting, typed lint and production types
        run: yarn verify

  test:
    needs: lint
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Build project
        uses: ./.github/actions/build
        id: build
        with:
          yarn-hardened-mode: "0"
          cache-type: test
      - parallel:
          - name: Install Playwright browsers
            timeout-minutes: 5
            run: yarn workspace @allurereport/common-config playwright install chromium firefox webkit
          - name: Install playwright dependencies for e2e
            timeout-minutes: 5
            run: yarn workspace @allurereport/common-config playwright install-deps
      - name: Test Project
        env:
          ENABLE_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
        run: yarn allure run --config=./allurerc.mjs --environment=${{ matrix.os }} --dump=allure-results-${{ matrix.os }} -- yarn test
      - name: Save Vite Task cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.build.outputs.cache-key }}
      - name: Upload test results
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.os }}
          path: ./allure-results-${{ matrix.os }}.zip
      - name: Upload blob reports
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        with:
          name: vitest-blobs-${{ matrix.os }}
          path: packages/*/.vitest/blob/*.json
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [test]
    name: Upload test coverage
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.test.result) }}
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set up node and install dependencies
        uses: ./.github/actions/install
        with:
          yarn-hardened-mode: "0"
      - name: Download vitest blob reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: vitest-blobs-*
          path: ./
      - name: Generate test coverage report
        env:
          VITEST_BLOB_PATTERN: "**/.vitest/blob/*.json"
        run: yarn coverage
      - name: Publish code coverage
        uses: clearlyip/code-coverage-report-action@v7
        with:
          filename: packages/common-config/.vitest/coverage/cobertura-coverage.xml
          badge: true
          togglable-report: true
          report-low-coverage-only: true

  report:
    needs: [lint, test]
    name: Build report
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.test.result) && needs.lint.result != 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: write
    env:
      ALLURE_QUALITY_GATE: "1"
      ALLURE_REQUIRE_NEW_TESTS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'pr:new feature') && '1' || '' }}
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_LAUNCH_TAGS: "${{ secrets.ALLURE_LAUNCH_TAGS }}, ${{ github.event_name }}"
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Download allure results
        timeout-minutes: 10
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: ./
      - name: Build project
        uses: ./.github/actions/build
        with:
          yarn-hardened-mode: "0"
      - name: Measure report generation
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-perf-probe-results
        run: yarn workspace @allurereport/core test --config=vitest.perf.config.ts
      - name: Start TestOps upload with performance probe result
        run: yarn allure generate --config=./.github/allurerc.testops-probe.mjs ./allure-perf-probe-results --output=./allure-perf-testops-upload
      - name: Attach main report upload to performance probe launch
        id: performance-probe-launch
        run: |
          node -e 'const { appendFileSync, readFileSync } = require("node:fs"); const summary = JSON.parse(readFileSync("./allure-perf-testops-upload/summary.json", "utf8")); const launchId = Number(new URL(summary.remoteHref).pathname.split("/").filter(Boolean).at(-1)); if (!Number.isInteger(launchId) || launchId <= 0) throw new Error("TestOps summary does not contain a valid launch id"); appendFileSync(process.env.GITHUB_OUTPUT, `launch-id=${launchId}\n`);'
      - name: Prepare report metrics
        run: |
          mkdir -p ./allure-perf-results
          cp ./allure-perf-probe-results/*-perf.json ./allure-perf-results/
      - name: Generate report
        env:
          ALLURE_LAUNCH_ID: ${{ steps.performance-probe-launch.outputs.launch-id }}
        run: yarn allure generate --config=./allurerc.mjs --dump="allure-results-*/*.zip" ./allure-perf-results --output=./allure-report
      - name: Allure Report Official
        if: ${{ !cancelled() }}
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
