name: "Assign pr reviewer"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: allure-framework/review-roulette@v0.0.1
        with:
          organizations: ${{ github.repository_owner }}
          reviewers: |
            andrcuns
            delatrie
            epszaw
            formaceft-93
            vdvukzhilov
            todti
