name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.x"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: yarn install, build
        run: |
          yarn install
          yarn build
          yarn workspace allure run compile:process-host --force --use-dotnet
          test -s packages/cli/dist/utils/supervisor/windows/process-host.exe

      - run: yarn workspaces foreach -Avv --no-private npm publish --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
